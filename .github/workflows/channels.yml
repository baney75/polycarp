name: Channels
# The release rules a machine can check (docs/releases.md): the version, feed, publish, install and Info.plist
# scripts and the release gate do what docs/releases.md says. Every pull request, no path filter.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  channels:
    # macOS for plutil and lipo, which the Info.plist and feed checks use.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version strings, the feed and the Info.plist template
        run: bash spaces/scripts/channels-test.sh && bash spaces/scripts/tests/channel-gates-test.sh \
          && bash spaces/scripts/tests/install-arch-test.sh && bash spaces/scripts/tests/install-source-test.sh
      - name: Setting the signing secrets from the owner's Mac
        run: bash spaces/scripts/tests/set-ci-signing-test.sh
