name: Channels
# The release channel rules a machine can check (docs/releases.md): no workflow starts on a pushed tag, the
# stable environment runs only from workflow_call or workflow_dispatch, versions sort dev < nightly < stable,
# and the version, feed and Info.plist scripts do what docs/releases.md says. Every pull request, no path filter.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  channels:
    # macOS for plutil and lipo, which the Info.plist and feed checks use.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The channel rules (copied from baney75/local-studio)
        run: bash scripts/check-channels.sh && bash scripts/tests/check-channels-test.sh
      - name: Version strings, the feed and the Info.plist template
        run: bash spaces/scripts/channels-test.sh
