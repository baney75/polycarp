name: Nightly
# One nightly a day from main (docs/releases.md): only when main moved since the last nightly, CI is green on it,
# and no open issue is labeled both `regression` and `blocks-nightly`. channel-build.yml builds and publishes it.
# Then nightly-YYYYMMDDHHMMSS prereleases older than 14 days are deleted; the newest one is always kept.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      bridge:
        description: 'The first nightly only: also put it on the old preview release (docs/release-gate.md)'
        type: boolean
        default: false
concurrency:
  group: nightly
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
      commit: ${{ steps.decide.outputs.commit }}
      time: ${{ steps.decide.outputs.time }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          stop() { echo "::notice title=No nightly::$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # The newest main commit with a green CI run of its own. CI skips commits that touch no app or CLI path, so
          # main's head may have no run; building the newest tested commit never ships an untested one.
          SHA=$(gh run list -R "$REPO" --workflow ci.yml --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          [ -n "$SHA" ] || stop "no CI run on main has passed."
          [ "$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)" != diverged ] || stop "$SHA isn't on main any more."
          if LAST=$(gh api "repos/$REPO/git/ref/tags/nightly" --jq .object.sha 2>"$RUNNER_TEMP/last.err"); then
            REL=$(gh api "repos/$REPO/compare/$LAST...$SHA" --jq .status)
            [ "$REL" = ahead ] || { [ "$REL" = identical ] && [ "$EVENT" = workflow_dispatch ]; } \
              || stop "the newest tested commit, $SHA, is $REL of $LAST, the commit of the last nightly."
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/last.err" || { cat "$RUNNER_TEMP/last.err" >&2; exit 1; }
          fi
          OPEN=$(gh issue list -R "$REPO" --state open --label regression --label blocks-nightly --json number --jq 'map("#\(.number)") | join(" ")')
          [ -z "$OPEN" ] || stop "open regressions block it: $OPEN"
          { echo "go=true"; echo "commit=$SHA"; echo "time=$(date -u +%Y%m%d%H%M%S)"; } >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/channel-build.yml
    with:
      channel: nightly
      commit: ${{ needs.gate.outputs.commit }}
      build_time: ${{ needs.gate.outputs.time }}
      bridge: ${{ github.event_name == 'workflow_dispatch' && inputs.bridge }}
    secrets:
      POLYCARP_SIGNING_P12: ${{ secrets.POLYCARP_SIGNING_P12 }}
      POLYCARP_SIGNING_P12_PASSWORD: ${{ secrets.POLYCARP_SIGNING_P12_PASSWORD }}
  prune:
    needs: [gate, build]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete nightly-<time> prereleases older than 14 days, keeping the newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CUT=$(date -u -d '14 days ago' +%Y%m%d%H%M%S)
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name' \
            | { grep -E '^nightly-[0-9]{14}$' || true; } | sort -r | tail -n +2 \
            | while read -r t; do
                [ "${t#nightly-}" \< "$CUT" ] || continue
                echo "deleting $t"
                gh release delete "$t" -R "$REPO" --cleanup-tag --yes
              done
