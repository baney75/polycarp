name: Stable build
# Called by promote.yml only. Builds the universal app at the stable tag and uploads it into that tag's draft
# (spaces/scripts/release.sh, the stable path): it never publishes. Publishing is spaces/scripts/release.sh --soak
# on the owner's Mac after scripts/soak-check.sh prints SOAK PASSED (spaces/AGENTS.md, "Stable releases").
# Without the signing secrets it builds nothing and says what to run on the Mac.
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
    secrets:
      POLYCARP_SIGNING_P12: { required: false }
      POLYCARP_SIGNING_P12_PASSWORD: { required: false }
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    environment: stable
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: The signing identity
        id: sign
        env:
          POLYCARP_SIGNING_P12: ${{ secrets.POLYCARP_SIGNING_P12 }}
          POLYCARP_SIGNING_P12_PASSWORD: ${{ secrets.POLYCARP_SIGNING_P12_PASSWORD }}
        run: |
          set +e
          scripts/ci-signing.sh; code=$?
          set -e
          if [ $code = 3 ]; then
            echo "::warning title=${{ inputs.tag }} not built::The signing secrets are not set. On the owner's Mac: git fetch --tags && git checkout ${{ inputs.tag }} && spaces/scripts/release.sh (docs/releases.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ $code = 0 ] && echo "signed=true" >> "$GITHUB_OUTPUT"
          exit $code
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sign.outputs.signed == 'true'
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.sign.outputs.signed == 'true'
        with:
          bun-version: 1.3.14
      - name: Build, sign, package, verify and upload into the draft
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
