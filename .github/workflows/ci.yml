name: CI
on:
  push:
    branches: [main]
    paths: ['cli/**', 'spaces/**', 'core/**', 'install.sh', '.github/workflows/ci.yml']
  pull_request:
    paths: ['cli/**', 'spaces/**', 'core/**', 'install.sh', '.github/workflows/ci.yml']
# A new push to a pull request cancels its older run. Each push to main gets its own group and is never cancelled:
# with one group per ref, back-to-back merges cancelled each other (49 of the 102 cancelled runs in 200), leaving main
# untested.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.f.outputs.cli }}
      spaces: ${{ steps.f.outputs.spaces }}
      core: ${{ steps.f.outputs.core }}
      spaces-rust: ${{ steps.f.outputs.spaces-rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # The cli tests also replay an older Linux update against the stubs in spaces/platforms/linux,
            # and check the spaces workspace's binary names.
            cli: ['cli/**', 'spaces/platforms/linux/**', 'spaces/Cargo.toml', 'spaces/Cargo.lock', '.github/workflows/ci.yml']
            # The root install.sh is read by the spaces tests (RootInstallerTests, FeaturesTests).
            spaces: ['spaces/**', 'core/**', 'install.sh', '.github/workflows/ci.yml']
            core: ['core/**', '.github/workflows/ci.yml']
            # The spaces Rust workspace: the shared core, the conformance cases, the Windows crates and the Linux update stub.
            spaces-rust: ['spaces/Cargo.toml', 'spaces/Cargo.lock', 'spaces/crates/**', 'spaces/spec/**', 'spaces/platforms/windows/**', 'spaces/platforms/linux/**', '.github/workflows/ci.yml']

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: cli }
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rust 1.100 moved build scripts' OUT_DIR one folder deeper. ort-sys 2.0.0-rc.13 finds the
      # target dir from it and panics copying DirectML.dll on Windows; rc.14 fixes that, but
      # transcribe-rs 0.3.12 doesn't build against rc.14. Drop the pin when transcribe-rs moves.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ matrix.os == 'windows-latest' && '1.99.1' || 'stable' }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core/ffi
          key: ${{ matrix.os }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxdo-dev
      # The engine (polycarp-voice) lives in baney75/silas; this tests the commit core/ffi's Cargo.lock pins.
      - name: Voice engine tests, at the pinned Silas commit
        working-directory: core/ffi
        run: cargo test --locked -p polycarp-voice
      - name: C ABI tests, on macOS for the native app's library
        if: runner.os == 'macOS'
        working-directory: core/ffi
        run: cargo test && cargo clippy --all-targets -- -D warnings

  spaces:
    needs: changes
    if: needs.changes.outputs.spaces == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rust builds the same crates every run. The engine isn't cached: its script rebuilds that tree from a pinned tarball.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core/ffi
          key: spaces
      - name: Check the install scripts
        run: bash -n install.sh && bash -n uninstall.sh && bash -n scripts/bundle.sh && bash -n scripts/build-engine.sh && bash -n scripts/build-core.sh
      - name: Build the hands engine
        run: BANEYSPACES_ARM64_ONLY=1 scripts/build-engine.sh
      - name: Build the voice core
        run: BANEYSPACES_ARM64_ONLY=1 scripts/build-core.sh
      - name: Test
        run: swift test

  # The spaces Rust workspace on Windows: the shared core, the conformance cases and the real Windows code
  # (issue #379, item 1). The Linux daemon that also built here is retired.
  spaces-windows:
    needs: changes
    if: needs.changes.outputs.spaces-rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces, key: spaces-windows }
      - name: Core and the Windows daemon, built for Windows
        run: cargo test --locked -p baneyspaces-core -p baneyspaces-windows -p baneyspaces-testapp -p baneyspaces-linux
      - name: Clippy on the Windows crates (with and without the test hooks)
        shell: bash
        run: |
          cargo clippy --locked -p baneyspaces-windows -p baneyspaces-testapp --all-targets -- -D warnings
          cargo clippy --locked -p baneyspaces-windows --all-targets --features test-ops -- -D warnings

  # The daemon live on the runner's own desktop (an interactive session with explorer.exe and DWM): real windows,
  # the real keyboard hook typed into with SendInput, Win32 read-backs and screenshots. tests/ci/live.ps1 ports
  # tests/live.sh; platforms/windows/README.md lists what a runner can't run.
  spaces-windows-live:
    needs: changes
    if: needs.changes.outputs.spaces-rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces, key: spaces-windows-live }
      # The hands engine at the pinned commit, built once per pin.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: spaces/platforms/windows/engine
          key: windows-engine-${{ hashFiles('spaces/platforms/windows/engine.pin') }}
      - name: Build the daemon with the test hooks, the test app and the engine
        shell: bash
        run: |
          cargo build --release --locked -p baneyspaces-windows --features baneyspaces-windows/test-ops -p baneyspaces-testapp
          test -f platforms/windows/engine/agent-desktop.exe || pwsh -NoProfile -File platforms/windows/scripts/build-engine.ps1
          dest="$(cygpath -u "$LOCALAPPDATA")/BaneySpaces/engine"
          mkdir -p "$dest"
          cp platforms/windows/engine/* "$dest/"
      # Off a runner the suite must refuse before it touches anything: no -Disposable, exit 2, Notepad left open.
      - name: Live suite refuses a desktop that isn't disposable
        shell: powershell
        run: platforms/windows/tests/ci/refuses.ps1 -Bin target/release -Out ${{ runner.temp }}/refused
      - name: Live suite
        shell: powershell
        # The suite takes a few minutes; a hang ends the step here, so the artifact below still uploads.
        timeout-minutes: 20
        run: platforms/windows/tests/ci/live.ps1 -Bin target/release -Out ${{ runner.temp }}/live
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-live
          path: ${{ runner.temp }}/live

  spaces-bundle:
    needs: changes
    # The bundle holds the voice core and the `polycarp` command, so a change to either can break it.
    if: needs.changes.outputs.spaces == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.core == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core/ffi
            cli -> ../spaces/build/cli-target
          key: spaces-bundle
      - name: Bundle the app
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
      - name: The licence of ported code and the probe app are in the bundle
        run: |
          test -s build/Polycarp.app/Contents/Resources/licenses/cua-driver-MIT.txt
          test -s build/Polycarp.app/Contents/Resources/probe/CanvasProbe.cdhash
          codesign --verify --deep --strict build/Polycarp.app/Contents/Resources/probe/CanvasProbe.app
      - name: The app is signed and carries no browser helper (it moved to Tychicus)
        run: |
          codesign --verify --deep --strict build/Polycarp.app
          test ! -e build/Polycarp.app/Contents/Resources/browser
  ci-ok:
    if: always()
    needs: [changes, cli, core, spaces, spaces-windows, spaces-windows-live, spaces-bundle]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          test "$FAILED" = false
