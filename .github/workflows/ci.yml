name: CI
on:
  push:
    branches: [main]
    paths: ['cli/**', 'spaces/**', 'browser/**', 'plugins/**', 'themes/**', 'install.sh', '.github/workflows/ci.yml']
  pull_request:
    paths: ['cli/**', 'spaces/**', 'browser/**', 'plugins/**', 'themes/**', 'install.sh', '.github/workflows/ci.yml']
# A new push to a pull request cancels its older run. Each push to main gets its own group and is never cancelled:
# with one group per ref, back-to-back merges cancelled each other (49 of the 102 cancelled runs in 200), leaving main
# untested.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.f.outputs.cli }}
      spaces: ${{ steps.f.outputs.spaces }}
      spaces-rust: ${{ steps.f.outputs.spaces-rust }}
      omarchy: ${{ steps.f.outputs.omarchy }}
      browser-sync: ${{ steps.f.outputs.browser-sync }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A job gated on an output this job doesn't define is always skipped, and ci-ok counts a skip as a pass.
      - name: Every changes output a job reads is defined here
        run: |
          python3 - <<'EOF'
          import re, sys
          s = open('.github/workflows/ci.yml').read()
          block = re.search(r'^  changes:\n(?:    .*\n)*?    outputs:\n((?:      .*\n)+)', s, re.M).group(1)
          have = set(re.findall(r'^      ([\w-]+):', block, re.M))
          want = set(re.findall(r'needs\.changes\.outputs\.([\w-]+)', s))
          if want - have:
              sys.exit(f"ci.yml reads changes outputs it never defines: {sorted(want - have)}")
          print(f"{len(want)} outputs read, all defined: {sorted(want)}")
          EOF
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            # The cli tests also replay an older Linux update against the stubs in spaces/platforms/linux,
            # check the spaces workspace's binary names, and check that every field on the surfaces page says
            # whether a look holds it (tests/look.rs).
            cli: ['cli/**', 'browser/**', 'spaces/platforms/linux/**', 'spaces/Cargo.toml', 'spaces/Cargo.lock', 'spaces/docs/surfaces.md', '.github/workflows/ci.yml']
            # The root install.sh is read by the spaces tests (RootInstallerTests, FeaturesTests).
            spaces: ['spaces/**', 'browser/**', 'install.sh', '.github/workflows/ci.yml']
            # The spaces Rust workspace: the shared core, the conformance cases, the Windows crates and the Linux update stub.
            spaces-rust: ['spaces/Cargo.toml', 'spaces/Cargo.lock', 'spaces/crates/**', 'spaces/spec/**', 'spaces/platforms/windows/**', 'spaces/platforms/linux/**', '.github/workflows/ci.yml']
            omarchy: ['plugins/**', 'themes/**', '.github/workflows/ci.yml']
            # Sync between a person's own devices: a crate of its own, tested against no real account, passkey or profile.
            browser-sync: ['browser/sync/**', '.github/workflows/ci.yml']

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: cli }
      - run: cargo test
      # Makes a throwaway certificate and keychain, so only here: two builds of Polycarp Browser must look like one app.
      # It must run exactly one test: a renamed test would otherwise match nothing and pass.
      - if: runner.os == 'macOS'
        run: |
          cargo test --bin polycarp -- --ignored --exact browser::sign::tests::two_builds_have_the_same_designated_requirement | tee "$RUNNER_TEMP/sign.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/sign.log"
      # Downloads Helium's real Windows release, checks its signatures and builds Polycarp Browser from it with the parts
      # made here, then refuses a copy with one byte changed. Then installs it into runner temp folders, never the
      # runner's own, reads its status and uninstalls it.
      - if: runner.os == 'Windows'
        shell: bash
        env:
          POLYCARP_BROWSER_RESOURCES: ${{ runner.temp }}/parts
          POLYCARP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCALAPPDATA: ${{ runner.temp }}/la
          APPDATA: ${{ runner.temp }}/ad
        run: |
          mkdir -p "$LOCALAPPDATA" "$APPDATA"
          env -u POLYCARP_GITHUB_TOKEN ../browser/scripts/build-parts-windows.sh "$POLYCARP_BROWSER_RESOURCES"
          cargo test --bin polycarp -- --ignored --exact --test-threads 1 browser_windows::tests::the_real_release_passes_and_a_changed_program_is_refused browser_windows::tests::the_real_release_installs_and_uninstalls | tee "$RUNNER_TEMP/helium-windows.log"
          grep -q "test result: ok. 2 passed" "$RUNNER_TEMP/helium-windows.log"
      # Downloads Helium's real Linux release, checks its sha256 and OpenPGP signature, builds Polycarp Browser from it with the
      # parts made here and starts it once headless, then refuses a copy with one byte changed.
      # The workflow's own token goes to the release listing only, so a shared runner's address isn't rate limited.
      # The start runs under Chromium's own sandbox, which needs unprivileged user namespaces; Ubuntu 24.04's AppArmor
      # restricts them, so the runner allows them here. Polycarp never passes --no-sandbox.
      - if: runner.os == 'Linux'
        env:
          POLYCARP_BROWSER_RESOURCES: ${{ runner.temp }}/parts
          POLYCARP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          env -u POLYCARP_GITHUB_TOKEN ../browser/scripts/build-parts-linux.sh "$RUNNER_TEMP/parts"
          cargo test --bin polycarp -- --ignored --exact browser_linux::tests::the_real_release_passes_and_a_changed_tarball_is_refused | tee "$RUNNER_TEMP/helium-linux.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/helium-linux.log"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      # Polycarp Browser's launcher, a program of its own (GPL).
      - working-directory: browser/launcher
        shell: bash
        run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check

  browser-sync:
    needs: changes
    if: needs.changes.outputs.browser-sync == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: browser/sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: browser/sync }
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check

  # Known holes, licenses GPL-3.0 can carry, and no crate from anywhere but crates.io.
  browser-sync-deny:
    needs: changes
    if: needs.changes.outputs.browser-sync == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: browser/sync/Cargo.toml
          arguments: --all-features

  spaces:
    needs: changes
    if: needs.changes.outputs.spaces == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the install scripts
        run: bash -n install.sh && bash -n uninstall.sh && bash -n scripts/bundle.sh && bash -n scripts/build-ghostty.sh && bash -n scripts/fetch-zig.sh
      - name: Test
        run: swift test

  # The built-in terminal: libghostty from the pinned Ghostty (spaces/ghostty/PIN), built once per pin and cached,
  # then Polycarp built, tested and bundled with it linked. The spaces job above builds and tests without it, as an
  # Intel or universal build and a Mac without the Metal Toolchain do.
  spaces-terminal:
    needs: changes
    if: needs.changes.outputs.spaces == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: ghostty
        with:
          path: spaces/ghostty/lib
          key: ghostty-${{ runner.arch }}-${{ hashFiles('spaces/ghostty/PIN', 'spaces/scripts/build-ghostty.sh') }}
      - name: Zig and the Metal Toolchain for the libghostty build
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-zig.sh >> "$GITHUB_PATH"
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build libghostty
        run: scripts/build-ghostty.sh
      - name: Build with the terminal linked
        run: |
          POLYCARP_TERMINAL=1 swift build
          # Into a file first: with pipefail, grep -q quitting early kills nm with SIGPIPE and fails the step.
          nm "$(POLYCARP_TERMINAL=1 swift build --show-bin-path)/BaneySpaces" > "$RUNNER_TEMP/symbols.txt"
          grep -q ' T _ghostty_app_new$' "$RUNNER_TEMP/symbols.txt"
      - name: Test with the terminal linked
        run: POLYCARP_TERMINAL=1 swift test
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli -> ../spaces/build/cli-target
          key: spaces-terminal
      - name: Bundle the app with the terminal
        run: |
          BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh | tee "$RUNNER_TEMP/bundle.log"
          grep -q 'terminal built)$' "$RUNNER_TEMP/bundle.log"
          test -f build/Polycarp.app/Contents/Resources/terminfo/78/xterm-ghostty
          test -d build/Polycarp.app/Contents/Resources/ghostty/shell-integration
          test -s build/Polycarp.app/Contents/Resources/licenses/ghostty-MIT.txt

  # The spaces Rust workspace on Windows: the shared core, the conformance cases and the real Windows code
  # (issue #379, item 1). The Linux daemon that also built here is retired.
  spaces-windows:
    needs: changes
    if: needs.changes.outputs.spaces-rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces, key: spaces-windows }
      - name: Core and the Windows daemon, built for Windows
        run: cargo test --locked -p baneyspaces-core -p baneyspaces-windows -p baneyspaces-testapp -p baneyspaces-linux
      - name: Clippy on the Windows crates (with and without the test hooks)
        shell: bash
        run: |
          cargo clippy --locked -p baneyspaces-windows -p baneyspaces-testapp --all-targets -- -D warnings
          cargo clippy --locked -p baneyspaces-windows --all-targets --features test-ops -- -D warnings

  # The daemon live on the runner's own desktop (an interactive session with explorer.exe and DWM): real windows,
  # the real keyboard hook typed into with SendInput, Win32 read-backs and screenshots. tests/ci/live.ps1 ports
  # tests/live.sh; platforms/windows/README.md lists what a runner can't run.
  spaces-windows-live:
    needs: changes
    if: needs.changes.outputs.spaces-rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces, key: spaces-windows-live }
      - name: Build the daemon with the test hooks and the test app
        run: cargo build --release --locked -p baneyspaces-windows --features baneyspaces-windows/test-ops -p baneyspaces-testapp
      # Off a runner the live suite, the switch bench and the keymap check must refuse before they touch anything: no -Disposable, exit 2,
      # Notepad left open, state.json kept.
      - name: Live suite, switch bench and keymap check refuse a desktop that isn't disposable
        shell: powershell
        run: platforms/windows/tests/ci/refuses.ps1 -Bin target/release -Out ${{ runner.temp }}/refused
      # refuses.ps1 writes a stand-in record, so off a runner it must refuse too and leave a real state.json as it was.
      - name: The refusal check itself refuses a desktop that isn't disposable
        shell: bash
        run: |
          rec="$(cygpath -u "$LOCALAPPDATA")/BaneySpaces/state.json"; mkdir -p "$(dirname "$rec")"
          mark="a real recovery record $RANDOM$RANDOM"; printf '%s' "$mark" > "$rec"
          code=0; GITHUB_ACTIONS= powershell -NoProfile -File platforms/windows/tests/ci/refuses.ps1 -Bin target/release -Out "$RUNNER_TEMP/refused-self" 2> "$RUNNER_TEMP/refuses-self.err" || code=$?
          now="$(tr -d '\r\n' < "$rec")"; rm -f "$rec"
          echo "refuses.ps1 -> exit $code, state.json kept $([ "$now" = "$mark" ] && echo True || echo False): $(cat "$RUNNER_TEMP/refuses-self.err")"
          [ "$code" = 2 ] && [ "$now" = "$mark" ] && grep -q 'refuses.ps1: refused' "$RUNNER_TEMP/refuses-self.err"
      - name: Live suite
        shell: powershell
        # The suite takes a few minutes; a hang ends the step here, so the artifact below still uploads.
        timeout-minutes: 20
        run: platforms/windows/tests/ci/live.ps1 -Bin target/release -Out ${{ runner.temp }}/live
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-live
          path: ${{ runner.temp }}/live

  # The switch-speed bench on the runner's desktop: 30 windows over nine workspaces, 200 Win+n switches typed with
  # SendInput, each timed until DWM reads every window right and checked by screenshot, and an outside uncloak timed
  # until the daemon undoes it. Limits are in tests/ci/switch-bench.ps1 and spec/speed.json (windowsSwitch).
  spaces-windows-speed:
    needs: changes
    if: needs.changes.outputs.spaces-rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces, key: spaces-windows-speed }
      - name: Build the daemon with the test hooks
        run: cargo build --release --locked -p baneyspaces-windows --features baneyspaces-windows/test-ops
      - name: Switch bench
        shell: powershell
        # The bench takes a few minutes; a hang ends the step here, so the artifact below still uploads.
        timeout-minutes: 15
        run: platforms/windows/tests/ci/switch-bench.ps1 -Bin target/release -Out ${{ runner.temp }}/speed -Speed spec/speed.json
      - name: Keymap
        if: always()
        shell: powershell
        run: platforms/windows/tests/ci/keymap.ps1 -Bin target/release -Out ${{ runner.temp }}/speed/keymap
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-speed
          path: ${{ runner.temp }}/speed

  spaces-bundle:
    needs: changes
    # The bundle holds the `polycarp` command, so a change to it can break it.
    if: needs.changes.outputs.spaces == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli -> ../spaces/build/cli-target
          key: spaces-bundle
      - name: Bundle the app
        run: BANEYSPACES_ADHOC=1 BANEYSPACES_ARM64_ONLY=1 scripts/bundle.sh
      - name: The app is signed, carries what Polycarp Browser is built from, and no browser helper or computer use engine (they were removed)
        run: |
          codesign --verify --deep --strict build/Polycarp.app
          test ! -e build/Polycarp.app/Contents/Resources/browser
          cd build/Polycarp.app/Contents/Resources/make-browser
          test "$(ls | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE changes.toml icon-32.png icon.icns launcher signing-identity.sh "
          test -x launcher
          for part in *; do test -s "$part"; done
          cd "$GITHUB_WORKSPACE/spaces"
          test ! -e build/Polycarp.app/Contents/Frameworks
  omarchy:
    needs: changes
    if: needs.changes.outputs.omarchy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The plugin's models, scripts and package
        working-directory: plugins/omarchy
        run: node --test test/*.test.mjs
      - name: Its publish script, against throwaway repos
        run: bash plugins/publish-omarchy-test.sh

  ci-ok:
    if: always()
    needs: [changes, cli, browser-sync, browser-sync-deny, spaces, spaces-terminal, spaces-windows, spaces-windows-live, spaces-windows-speed, spaces-bundle, omarchy]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          test "$FAILED" = false
