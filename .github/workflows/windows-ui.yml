name: Windows UI
# The Windows shell (bar and launcher) on a real Windows desktop: GitHub's windows-latest runner has an interactive
# session, so windows draw, keys can be sent with SendInput and the screen can be captured.
on:
  pull_request:
    paths: ['spaces/platforms/windows/**', 'spaces/crates/**', 'spaces/spec/**', '.github/workflows/windows-ui.yml']
  push:
    branches: [main]
    paths: ['spaces/platforms/windows/**', 'spaces/crates/**', 'spaces/spec/**', '.github/workflows/windows-ui.yml']
  workflow_dispatch:
concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  stack-spike:
    # The UI stack decision: the same launcher-sized frame drawn natively (Direct2D through DirectComposition) and in
    # WebView2, each timed from the hotkey to the first composed frame, with idle CPU and memory of its process tree.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: spaces/platforms/windows/spike
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces/platforms/windows/spike, key: windows-ui-spike }
      - name: Build both candidates
        run: cargo build --release
      - name: Binary sizes
        shell: pwsh
        run: Get-Item target/release/spike-*.exe | ForEach-Object { "{0} {1:N0} KB" -f $_.Name, ($_.Length / 1KB) }
      - name: Measure native (Direct2D and DirectComposition)
        shell: pwsh
        run: ./measure.ps1 -Exe target/release/spike-native.exe -Name native -Out results
      - name: Measure WebView2 (wry)
        shell: pwsh
        run: ./measure.ps1 -Exe target/release/spike-webview.exe -Name webview -Out results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stack-spike
          path: spaces/platforms/windows/spike/results
