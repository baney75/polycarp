name: Windows UI
# Probe for review round 1 of #427 (sol-F1): the reviewed head 811c12a8 plus only the SPIKE_FAIL_DRAW hook. It shows
# what the old harness does when every native draw fails. Not for merge.
on:
  push:
    branches: [windows-ui-spike-r1-probe]
permissions:
  contents: read
jobs:
  stack-spike:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spaces/platforms/windows/spike
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: spaces/platforms/windows/spike, key: windows-ui-spike }
      - name: Build the native candidate
        run: cargo build --release -p spike-native
      - name: A draw that fails must fail the measurement
        shell: powershell
        run: |
          $env:SPIKE_FAIL_DRAW = '1'
          try { & ./measure.ps1 -Exe target/release/spike-native.exe -Name native-faildraw -Out results -Opens 3 -IdleSeconds 1; $passed = $true } catch { $passed = $false; Write-Host "measure.ps1: $_" }
          Write-Host '--- the candidate log:'; Get-Content results/native-faildraw.log -ErrorAction SilentlyContinue | Select-Object -First 12
          if ($passed) { Write-Host 'FAIL: measure.ps1 passed a run in which every draw failed'; exit 1 }
          Write-Host 'ok: measure.ps1 refused the run'
          exit 0
