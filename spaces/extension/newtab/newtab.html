<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="../src/shared/theme.css">
<script src="../src/shared/theme-live.js" data-ask="page"></script>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<div id="paper" class="paper" data-paper="none" aria-hidden="true"></div>
<main>
	<form id="ask" autocomplete="off">
		<label class="hide" for="field">Search or type an address</label>
		<input id="field" name="q" type="text" spellcheck="false" placeholder="Search or type an address" autofocus
			role="combobox" aria-autocomplete="list" aria-controls="finder" aria-expanded="false">
		<ul id="finder" class="finder" role="listbox" aria-label="Open tabs, bangs and the web" hidden></ul>
		<p id="hint" class="hint" aria-live="polite"></p>
	</form>
	<figure id="verse" class="verse" hidden>
		<blockquote id="verse-text"></blockquote>
		<figcaption id="verse-ref"></figcaption>
	</figure>
</main>
<script src="../src/shared/core.js"></script>
<script src="paper.js"></script>
<script src="logic.js"></script>
<script src="finder.js"></script>
<script src="newtab.js"></script>
</body>
</html>
