# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# build-msi.ps1 writes a copy with the real InstallerSha256 (and InstallerUrl, when given one) next to the MSI it built.
# The all-zero hash and ProductCode below are placeholders (build-msi.ps1 reads the real ProductCode from the MSI; winget
