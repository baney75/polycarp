[package]
name = "baneyspaces-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "BaneySpaces for Windows: the `baneyspaces` CLI and `baneyspaces daemon`"

[[bin]]
name = "baneyspaces"
path = "src/main.rs"

[features]
# The live tests' hooks: BANEYSPACES_TEST_OPS is honored only in a build made with this feature. A release build
# made without it ignores the variable, whatever is in the environment.
test-ops = []

[dependencies]
baneyspaces-core = { path = "../../../crates/baneyspaces-core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The shell's drawing (Direct3D 11, Direct2D, DirectWrite, DirectComposition): COM, which windows-sys does not cover.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
] }
