[package]
name = "polycarp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "One command that hands off to Polycarp Spaces"
publish = false

[[bin]]
name = "polycarp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# The agent gateway: token hashes and PKCE (SHA-256) and the operating system's random numbers.
sha2 = "0.10"
getrandom = "0.2"
toml_edit = "0.23"
age = "0.11"
ed25519-dalek = "2"
hkdf = "0.12"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
