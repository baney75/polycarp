[package]
name = "polycarp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "One command that hands off to BaneySpaces, Tabkyra and Silas"
publish = false

[[bin]]
name = "polycarp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
