[package]
name = "polycarp-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "Sync between one person's own devices for Polycarp Browser"
publish = false

[dependencies]
chacha20poly1305 = "0.11"
getrandom = "0.3"
hkdf = "0.13"
iroh-base = { version = "1.5", default-features = false, features = ["key"] }
psl = "2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1.1"
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.1"
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
proptest = "1.12"

[lints.rust]
unsafe_code = "forbid"
