[package]
name = "polycarp-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "Sync between one person's own devices for Polycarp Browser"
publish = false

[dependencies]
chacha20poly1305 = "0.11"
getrandom = "0.3"
hkdf = "0.13"
psl = "2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proptest = "1.12"

[lints.rust]
unsafe_code = "forbid"
