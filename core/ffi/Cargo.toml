[package]
name = "polycarp-core"
version = "0.1.0"
description = "C ABI over polycarp-voice, linked into the native Mac app."
authors = ["Donovan Baney"]
license = "MIT"
edition = "2021"

[lib]
name = "polycarp_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
polycarp-voice = { path = "../voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
# Native objects, not bitcode: Xcode's linker must be able to read the static library.
lto = false
codegen-units = 4
strip = "debuginfo"
panic = "unwind"

[profile.release.build-override]
opt-level = 0
strip = false
codegen-units = 256
