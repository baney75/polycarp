# Catppuccin (MIT), from the tinted-theming base16 schemes Catppuccin Latte and Catppuccin Mocha.
# Made with `polycarp theme import`, which moved some colors to read at 4.5:1.
name = "catppuccin"
title = "Catppuccin"
description = "Soft pastels: Latte by day, Mocha by night."
extends = "polycarp"

[light]
accent = "#1d61e9"
background = "#eff1f5"
border = "#ccd0da"
done = "#307820"
foreground = "#4c4f69"
muted = "#62656c"
on_accent = "#eff1f5"
selection = "#ccd0da"
strong = "#4c4f69"
sunken = "#e3e5e9"
surface = "#f9f9fb"
urgent = "#d20f39"
working = "#915c13"

[light.terminal]
background = "#eff1f5"
black = "#eff1f5"
blue = "#1e66f5"
bright_black = "#bcc0cc"
bright_blue = "#1e66f5"
bright_cyan = "#179299"
bright_green = "#3d9829"
bright_magenta = "#8839ef"
bright_red = "#d20f39"
bright_white = "#7287fd"
bright_yellow = "#be7919"
cursor = "#4c4f69"
cyan = "#179299"
foreground = "#4c4f69"
green = "#3d9829"
magenta = "#8839ef"
red = "#d20f39"
selection = "#ccd0da"
white = "#dc8a78"
yellow = "#be7919"

[light.syntax]
attribute = "#b24608"
comment = "#676a70"
constant = "#b24608"
function = "#1d61e9"
keyword = "#8839ef"
number = "#b24608"
operator = "#4c4f69"
property = "#d20f39"
punctuation = "#4c4f69"
string = "#307820"
tag = "#d20f39"
type = "#915c13"
variable = "#d20f39"

[dark]
accent = "#89b4fa"
background = "#1e1e2e"
border = "#313244"
done = "#a6e3a1"
foreground = "#cdd6f4"
muted = "#9698a5"
on_accent = "#1e1e2e"
selection = "#313244"
strong = "#f5e0dc"
sunken = "#171723"
surface = "#2c2c3b"
urgent = "#f38ba8"
working = "#f9e2af"

[dark.terminal]
background = "#1e1e2e"
black = "#1e1e2e"
blue = "#89b4fa"
bright_black = "#45475a"
bright_blue = "#89b4fa"
bright_cyan = "#94e2d5"
bright_green = "#a6e3a1"
bright_magenta = "#cba6f7"
bright_red = "#f38ba8"
bright_white = "#b4befe"
bright_yellow = "#f9e2af"
cursor = "#cdd6f4"
cyan = "#94e2d5"
foreground = "#cdd6f4"
green = "#a6e3a1"
magenta = "#cba6f7"
red = "#f38ba8"
selection = "#313244"
white = "#f5e0dc"
yellow = "#f9e2af"

[dark.syntax]
