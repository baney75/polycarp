# Flexoki by Steph Ango (MIT), from the tinted-theming base16 schemes Flexoki Light and Flexoki Dark.
# Made with `polycarp theme import`, which moved some colors to read at 4.5:1.
name = "flexoki"
title = "Flexoki"
description = "Inky colors on warm paper, made for reading."
extends = "polycarp"

[light]
accent = "#205ea6"
background = "#fffcf0"
border = "#e6e4d9"
done = "#617a0a"
foreground = "#403e3c"
muted = "#696964"
on_accent = "#fffcf0"
selection = "#e6e4d9"
strong = "#100f0f"
sunken = "#f2efe4"
surface = "#fffef9"
urgent = "#af3029"
working = "#936f01"

[light.terminal]
background = "#fffcf0"
black = "#fffcf0"
blue = "#205ea6"
bright_black = "#cecdc3"
bright_blue = "#205ea6"
bright_cyan = "#24837b"
bright_green = "#66800b"
bright_magenta = "#5e409d"
bright_red = "#af3029"
bright_white = "#100f0f"
bright_yellow = "#ad8301"
cursor = "#403e3c"
cyan = "#24837b"
foreground = "#403e3c"
green = "#66800b"
magenta = "#5e409d"
red = "#af3029"
selection = "#e6e4d9"
white = "#282726"
yellow = "#ad8301"

[light.syntax]
attribute = "#bc5215"
comment = "#71716b"
constant = "#bc5215"
function = "#205ea6"
keyword = "#5e409d"
number = "#bc5215"
operator = "#403e3c"
property = "#af3029"
punctuation = "#403e3c"
string = "#617a0a"
tag = "#af3029"
type = "#936f01"
variable = "#af3029"

[dark]
accent = "#4c8bc1"
background = "#100f0f"
border = "#282726"
done = "#879a39"
foreground = "#cecdc3"
muted = "#878580"
on_accent = "#100f0f"
selection = "#282726"
strong = "#fffcf0"
sunken = "#0c0b0b"
surface = "#1c1b1a"
urgent = "#d55e54"
working = "#d0a215"

[dark.terminal]
background = "#100f0f"
black = "#100f0f"
blue = "#4385be"
bright_black = "#575653"
bright_blue = "#4385be"
bright_cyan = "#3aa99f"
bright_green = "#879a39"
bright_magenta = "#8b7ec8"
bright_red = "#d14d41"
bright_white = "#fffcf0"
bright_yellow = "#d0a215"
cursor = "#cecdc3"
cyan = "#3aa99f"
foreground = "#cecdc3"
green = "#879a39"
magenta = "#8b7ec8"
red = "#d14d41"
selection = "#282726"
white = "#e6e4d9"
yellow = "#d0a215"

[dark.syntax]
attribute = "#da702c"
comment = "#81807e"
constant = "#da702c"
function = "#4385be"
keyword = "#8b7ec8"
number = "#da702c"
operator = "#cecdc3"
property = "#d3564b"
punctuation = "#cecdc3"
string = "#879a39"
