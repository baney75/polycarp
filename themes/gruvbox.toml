# Gruvbox by morhetz (MIT/X11), from the tinted-theming base24 schemes Gruvbox Light and Gruvbox Dark.
# Made with `polycarp theme import`, which moved some colors to read at 4.5:1.
name = "gruvbox"
title = "Gruvbox"
description = "Retro warm browns with faded reds, yellows and greens."
extends = "polycarp"

[light]
accent = "#3b7174"
background = "#fbf1c7"
border = "#d5c4a1"
done = "#727114"
foreground = "#3c3836"
muted = "#70645a"
on_accent = "#fbf1c7"
selection = "#d5c4a1"
strong = "#1d2021"
sunken = "#eee5bd"
surface = "#fdf9e9"
urgent = "#cc241d"
working = "#8c6315"

[light.terminal]
background = "#fbf1c7"
black = "#fbf1c7"
blue = "#458588"
bright_black = "#bdae93"
bright_blue = "#076678"
bright_cyan = "#427b58"
bright_green = "#79740e"
bright_magenta = "#8f3f71"
bright_red = "#9d0006"
bright_white = "#1d2021"
bright_yellow = "#b57614"
cursor = "#3c3836"
cyan = "#639565"
foreground = "#3c3836"
green = "#908f19"
magenta = "#b16286"
red = "#cc241d"
selection = "#d5c4a1"
white = "#282828"
yellow = "#ac7a1a"

[light.syntax]
attribute = "#b64f0c"
comment = "#716858"
constant = "#b64f0c"
function = "#3b7174"
keyword = "#965372"
number = "#b64f0c"
operator = "#3c3836"
property = "#cc241d"
punctuation = "#3c3836"
string = "#727114"
tag = "#cc241d"
type = "#8c6315"
variable = "#cc241d"

[dark]
