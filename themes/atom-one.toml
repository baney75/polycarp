# Atom's One Light and One Dark (MIT, GitHub), from the tinted-theming base24 schemes One Light and
# One Dark. Made with `polycarp theme import`, which moved some colors to read at 4.5:1.
name = "atom-one"
title = "Atom One"
description = "Atom's One Light and One Dark: clean greys with clear, bright code colors."
extends = "polycarp"

[light]
accent = "#3360c2"
background = "#e7e7e9"
border = "#cacace"
done = "#387137"
foreground = "#383a42"
muted = "#5a5d66"
on_accent = "#e7e7e9"
selection = "#cacace"
strong = "#090a0b"
sunken = "#dbdbdd"
surface = "#f5f5f6"
urgent = "#ca1243"
working = "#7f5e15"

[light.terminal]
background = "#e7e7e9"
black = "#e7e7e9"
blue = "#4078f2"
bright_black = "#a0a1a7"
bright_blue = "#5f83d0"
bright_cyan = "#0186bf"
bright_green = "#579256"
bright_magenta = "#d02fcd"
bright_red = "#ec2258"
bright_white = "#090a0b"
bright_yellow = "#ab7501"
cursor = "#383a42"
cyan = "#0184bc"
foreground = "#383a42"
green = "#489147"
magenta = "#a626a4"
red = "#ca1243"
selection = "#cacace"
white = "#202227"
yellow = "#a57a1b"

[light.syntax]
attribute = "#875c01"
comment = "#606164"
constant = "#875c01"
function = "#3360c2"
keyword = "#a626a4"
number = "#875c01"
operator = "#383a42"
property = "#ca1243"
punctuation = "#383a42"
string = "#387137"
tag = "#ca1243"
type = "#7f5e15"
variable = "#ca1243"

[dark]
accent = "#6eb7f3"
background = "#282c34"
border = "#4f5666"
done = "#8cc265"
foreground = "#c8cdd5"
muted = "#b2b6bd"
on_accent = "#282c34"
selection = "#4f5666"
strong = "#ffffff"
sunken = "#21252b"
surface = "#3f4451"
urgent = "#ed9aa1"
working = "#e6b965"

[dark.terminal]
background = "#282c34"
black = "#282c34"
blue = "#4aa5f0"
bright_black = "#545862"
bright_blue = "#4dc4ff"
bright_cyan = "#4cd1e0"
bright_green = "#a5e075"
bright_magenta = "#de73ff"
bright_red = "#ff616e"
bright_white = "#ffffff"
bright_yellow = "#f0a45d"
cursor = "#abb2bf"
cyan = "#42b3c2"
foreground = "#c8cdd5"
green = "#8cc265"
magenta = "#c162de"
red = "#e05561"
selection = "#4f5666"
white = "#e6e6e6"
yellow = "#e6b965"

[dark.syntax]
attribute = "#d18f52"
comment = "#909299"
constant = "#d18f52"
function = "#4aa5f0"
keyword = "#c772e1"
number = "#d18f52"
operator = "#abb2bf"
property = "#e56f79"
punctuation = "#abb2bf"
string = "#8cc265"
tag = "#e56f79"
type = "#e6b965"
variable = "#e56f79"
