# A quiet blue-green accent over cool grey.
name = "still-water"
title = "Still Water"
description = "Quiet. Cool greys with a deep teal accent."
extends = "polycarp"

[light]
background = "#F1F5F5"
surface = "#FAFDFD"
sunken = "#E3EBEB"
foreground = "#233033"
strong = "#142022"
muted = "#51636A"
border = "#CBD8D9"
accent = "#3F6B6A"
on_accent = "#F1F5F5"
selection = "#D3E4E2"
urgent = "#A33A2A"
working = "#80651F"
done = "#2F6B55"

[dark]
background = "#1F2A2D"
surface = "#28363A"
sunken = "#182225"
foreground = "#E8F0F0"
strong = "#FFFFFF"
muted = "#B3C5C8"
border = "#3A4D52"
accent = "#A5CFCB"
on_accent = "#12201F"
selection = "#2F4A4B"
urgent = "#E58A76"
working = "#CDB57A"
done = "#8CCBB0"

# Code colors. The terminal's background, foreground, cursor and selection, and every diff
# color, are left to derive from the colors above.

[light.terminal]
black = "#233033"
red = "#98524C"
green = "#307954"
yellow = "#80651B"
blue = "#2C6F9A"
magenta = "#825689"
cyan = "#00797E"
white = "#C4CFCF"
bright_black = "#51636A"
bright_red = "#B2736D"
bright_green = "#5A9574"
bright_yellow = "#9A834B"
bright_blue = "#578DB2"
bright_magenta = "#9D76A3"
bright_cyan = "#419599"
bright_white = "#F6FCFC"

[light.syntax]
keyword = "#7C5083"
string = "#29734E"
number = "#7A5F13"
comment = "#607074"
function = "#256A94"
type = "#007378"
variable = "#233033"
constant = "#8D5322"
operator = "#495457"
punctuation = "#51636A"
tag = "#924C46"
attribute = "#7C5D2E"
property = "#326C7D"

[dark.terminal]
black = "#30393B"
red = "#D99890"
green = "#7FBB98"
yellow = "#C0A86F"
blue = "#7BB2D9"
magenta = "#C39AC9"
cyan = "#69BABF"
white = "#C5D0D0"
bright_black = "#6E7879"
bright_red = "#EFBCB6"
bright_green = "#ABD7BC"
bright_yellow = "#DBC99E"
bright_blue = "#A8D1EE"
bright_magenta = "#DEBEE2"
bright_cyan = "#9CD7DA"
bright_white = "#E8F0F0"

[dark.syntax]
keyword = "#D0A7D6"
string = "#8BC7A4"
number = "#CDB57B"
comment = "#849596"
function = "#88BFE6"
type = "#76C7CC"
variable = "#E8F0F0"
constant = "#E1AA82"
operator = "#A8B6B6"
punctuation = "#B3C5C8"
tag = "#E6A49D"
attribute = "#CFB28A"
property = "#90C0D0"
