# Slate and dusk blues. Muted.
name = "evening"
title = "Evening"
description = "Muted slate and dusk blues."
extends = "polycarp"

[light]
background = "#EFF1F4"
surface = "#F8F9FB"
sunken = "#E0E4EA"
foreground = "#272E37"
strong = "#171C23"
muted = "#505C69"
border = "#C9D0DA"
accent = "#4A5D6B"
on_accent = "#F8F9FB"
selection = "#D5DDE8"
urgent = "#A3392F"
working = "#80651F"
done = "#356A66"

[dark]
background = "#232A33"
surface = "#2C3541"
sunken = "#1B2129"
foreground = "#E6EAF0"
strong = "#FFFFFF"
muted = "#B2BCC9"
border = "#3F4B5B"
accent = "#93A9C9"
on_accent = "#141A22"
selection = "#34425A"
urgent = "#E88F86"
working = "#CDB57A"
done = "#8CBFB8"

# Code colors. The terminal's background, foreground, cursor and selection, and every diff
# color, are left to derive from the colors above.

[light.terminal]
black = "#272E37"
red = "#9A504E"
green = "#397949"
yellow = "#846313"
blue = "#4868A2"
magenta = "#765998"
cyan = "#00778A"
white = "#C5CAD2"
bright_black = "#505C69"
bright_red = "#B4716F"
bright_green = "#5E9369"
bright_yellow = "#9E8247"
bright_blue = "#6A86BA"
bright_magenta = "#9179B0"
bright_cyan = "#3E94A4"
bright_white = "#F5F8FC"

[light.syntax]
keyword = "#705491"
string = "#337344"
number = "#7E5D07"
comment = "#626B75"
function = "#43629C"
type = "#007184"
variable = "#272E37"
constant = "#915022"
operator = "#4B5159"
punctuation = "#505C69"
tag = "#944A49"
attribute = "#7F5B2B"
property = "#396986"

[dark.terminal]
black = "#34393F"
red = "#DC9693"
green = "#84BA8F"
yellow = "#C4A76B"
blue = "#8EABE1"
magenta = "#B69ED7"
cyan = "#65B9CA"
white = "#C4C9D1"
bright_black = "#72777E"
bright_red = "#F2BBB8"
bright_green = "#AED7B5"
bright_yellow = "#DEC89B"
bright_blue = "#B4CBF5"
bright_magenta = "#D3C1ED"
bright_cyan = "#9AD6E3"
bright_white = "#E6EAF0"

[dark.syntax]
keyword = "#C3AAE4"
string = "#90C79B"
number = "#D1B377"
comment = "#8C94A0"
function = "#9AB8EE"
type = "#72C6D7"
variable = "#E6EAF0"
constant = "#E5A881"
operator = "#AFB6BF"
punctuation = "#B2BCC9"
tag = "#E9A29F"
attribute = "#D3B188"
property = "#94BED9"
