# Ayu by Konstantin Pschera (MIT), from the tinted-theming base24 schemes Ayu Light and Ayu Dark.
# Made with `polycarp theme import`, which moved some colors to read at 4.5:1.
name = "ayu"
title = "Ayu"
description = "Bright and simple: Ayu Light and Ayu Dark."
extends = "polycarp"

[light]
accent = "#2b77ad"
background = "#f8f9fa"
border = "#d2d4d8"
done = "#467c2f"
foreground = "#575c61"
muted = "#63686d"
on_accent = "#f8f9fa"
selection = "#d2d4d8"
strong = "#404447"
sunken = "#ecedee"
surface = "#fcfdfd"
urgent = "#b45555"
working = "#91682c"

[light.terminal]
background = "#f8f9fa"
black = "#f8f9fa"
blue = "#3696db"
bright_black = "#a0a6ac"
bright_blue = "#478acc"
bright_cyan = "#4899b4"
bright_green = "#729800"
bright_magenta = "#9a7fb6"
bright_red = "#e66876"
bright_white = "#404447"
bright_yellow = "#bf8026"
cursor = "#5c6166"
cyan = "#3d997a"
foreground = "#575c61"
green = "#56993a"
magenta = "#a37acc"
red = "#e46b6b"
selection = "#d2d4d8"
white = "#4e5257"
yellow = "#b68337"

[light.syntax]
attribute = "#a35c28"
comment = "#686c70"
constant = "#a35c28"
function = "#2b77ad"
keyword = "#8262a3"
number = "#a35c28"
operator = "#5c6166"
property = "#b45555"
punctuation = "#5c6166"
string = "#467c2f"
tag = "#b45555"
type = "#91682c"
variable = "#b45555"

[dark]
accent = "#59c2ff"
background = "#0b0e14"
border = "#202229"
done = "#aad94c"
foreground = "#e6e1cf"
muted = "#bfbdb6"
on_accent = "#0b0e14"
selection = "#202229"
strong = "#f2f0e7"
sunken = "#0a0d13"
surface = "#131721"
urgent = "#f07178"
working = "#ffb454"

[dark.terminal]
background = "#0b0e14"
black = "#0b0e14"
blue = "#59c2ff"
bright_black = "#3e4b59"
bright_blue = "#73b8ff"
bright_cyan = "#39bae6"
bright_green = "#7fd962"
bright_magenta = "#ddbcff"
bright_red = "#f26d78"
bright_white = "#f2f0e7"
bright_yellow = "#e6b673"
cursor = "#e6e1cf"
cyan = "#95e6cb"
foreground = "#e6e1cf"
green = "#aad94c"
magenta = "#d2a6ff"
red = "#f07178"
selection = "#202229"
white = "#ece8db"
yellow = "#ffb454"

[dark.syntax]
attribute = "#ff8f40"
comment = "#78818b"
constant = "#ff8f40"
function = "#59c2ff"
keyword = "#d2a6ff"
number = "#ff8f40"
operator = "#e6e1cf"
property = "#f07178"
punctuation = "#e6e1cf"
string = "#aad94c"
tag = "#f07178"
type = "#ffb454"
variable = "#f07178"
