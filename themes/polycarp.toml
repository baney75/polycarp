# The Polycarp brand theme. Every other built-in theme starts from this one.
name = "polycarp"
title = "Polycarp"
description = "Warm paper and moss green. The default."

[light]
background = "#F6F3E8"
surface = "#FFFDF6"
sunken = "#ECE7D8"
foreground = "#2B2E26"
strong = "#1C1E18"
muted = "#5C6152"
border = "#D5D0BF"
accent = "#59693F"
on_accent = "#F6F3E8"
selection = "#DCE3CC"
urgent = "#A33A2A"
working = "#856A29"
done = "#3F6B6A"

[dark]
background = "#2B2E26"
surface = "#34382E"
sunken = "#23261F"
foreground = "#F6F3E8"
strong = "#FFFFFF"
muted = "#BDBFAF"
border = "#4A4E41"
accent = "#A9BB8A"
on_accent = "#20231A"
selection = "#3D4634"
urgent = "#E58A76"
working = "#C7B07A"
done = "#8EBDB9"

# Code colors. The terminal's background, foreground, cursor and selection, and every diff
# color, are left to derive from the colors above.

[light.terminal]
black = "#2B2E26"
red = "#9C5041"
green = "#57742C"
yellow = "#876207"
blue = "#386BA3"
magenta = "#914F7A"
cyan = "#007B78"
white = "#CECCC3"
bright_black = "#5C6152"
bright_red = "#B67264"
bright_green = "#769155"
bright_yellow = "#A18143"
bright_blue = "#5D89BB"
bright_magenta = "#AB7095"
bright_cyan = "#369794"
bright_white = "#FBFAF5"

[light.syntax]
keyword = "#8B4974"
string = "#526E26"
number = "#815C00"
comment = "#696E61"
function = "#32669D"
type = "#007573"
variable = "#2B2E26"
constant = "#915016"
operator = "#4F5249"
punctuation = "#5C6152"
tag = "#964A3C"
attribute = "#825A28"
property = "#2A6D81"

[dark.terminal]
black = "#3A3D36"
red = "#DB9789"
green = "#9BB57B"
yellow = "#C6A66B"
blue = "#83AFDF"
magenta = "#D196BA"
cyan = "#64BCB9"
white = "#D4D2C9"
bright_black = "#7D7A73"
bright_red = "#F1BCB1"
bright_green = "#BED3A7"
bright_yellow = "#E0C79C"
bright_blue = "#ADCEF4"
bright_magenta = "#E9BBD6"
bright_cyan = "#9AD8D5"
bright_white = "#F6F3E8"

[dark.syntax]
keyword = "#DEA2C7"
string = "#A8C287"
number = "#D3B378"
comment = "#9A9789"
function = "#90BBED"
type = "#71C9C5"
variable = "#F6F3E8"
constant = "#E4A97F"
operator = "#BCB9AF"
punctuation = "#BDBFAF"
tag = "#E9A495"
attribute = "#D4B088"
property = "#8DC1D3"

[shape]
radius_small = 6
radius = 10
radius_large = 16
border_width = 1
blur = 0
shadow = 0.12
density = "regular"
indicator = "dot"

[type]
display = 'Newsreader, "Iowan Old Style", Georgia, serif'
ui = 'system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif'
mono = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'
size = 16
weight = 400
line_height = 1.5

[motion]
fast = 120
normal = 200
slow = 320
easing = "cubic-bezier(0.2, 0, 0, 1)"
scale_from = 0.98
reduced = false
