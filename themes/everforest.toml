# Everforest by Sainnhe Park (MIT), from the tinted-theming base16 schemes Everforest Light Medium and
# Everforest Dark Medium. Made with `polycarp theme import`, which moved some colors to read at 4.5:1.
name = "everforest"
title = "Everforest"
description = "Soft greens on warm paper and deep forest."
extends = "polycarp"

[light]
accent = "#2e769e"
background = "#fdf6e3"
border = "#e6e2cc"
done = "#637101"
foreground = "#57656c"
muted = "#5e685d"
on_accent = "#fdf6e3"
selection = "#e6e2cc"
strong = "#2d353b"
sunken = "#f0ead8"
surface = "#fefbf4"
urgent = "#c64442"
working = "#916800"

[light.terminal]
background = "#fdf6e3"
black = "#fdf6e3"
blue = "#3a94c5"
bright_black = "#939f91"
bright_blue = "#3a94c5"
bright_cyan = "#329f76"
bright_green = "#7f9101"
bright_magenta = "#d464b1"
bright_red = "#f85552"
bright_white = "#2d353b"
bright_yellow = "#b28000"
cursor = "#5c6a72"
cyan = "#329f76"
foreground = "#57656c"
green = "#7f9101"
magenta = "#d464b1"
red = "#f85552"
selection = "#e6e2cc"
white = "#475258"
yellow = "#b28000"

[light.syntax]
attribute = "#ac581b"
comment = "#676f66"
constant = "#ac581b"
function = "#2e769e"
keyword = "#a74f8c"
number = "#ac581b"
operator = "#5c6a72"
property = "#c64442"
punctuation = "#5c6a72"
string = "#637101"
tag = "#c64442"
type = "#916800"
variable = "#c64442"

